; =============================================================================
; TURTLE - painlessMesh Project
; PlatformIO Configuration
; =============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib
include_dir = include
test_dir = test

; -----------------------------------------------------------------------------
; Shared settings across all environments
; -----------------------------------------------------------------------------
[common]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
;board_build.filesystem = SPIFFS

; painlessMesh core + dependencies
lib_deps =
    painlessmesh/painlessMesh @ ^1.5.0
    bblanchon/ArduinoJson @ ^7.3.0
    arkhipenko/TaskScheduler @ ^3.8.5

; Extra libs needed per platform are added in each [env] section
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DMESH_SSID=\"TURTLE_Mesh\"
    -DMESH_PASSWORD=\"TurtleMesh123!\"
    -DMESH_PORT=5555
    ; Uncomment and set these for LAN bridge mode:
    ; -DSTATION_SSID=\"YourWiFiSSID\"
    ; -DSTATION_PASSWORD=\"YourWiFiPassword\"

monitor_filters =
    default
    esp32_exception_decoder

; -----------------------------------------------------------------------------
; ESP32 DevKit V1 (most common board)
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags}
monitor_filters = ${common.monitor_filters}

lib_deps =
    ${common.lib_deps}

; Partition scheme — use "default" or "huge_app" if OTA isn't needed
; board_build.partitions = default.csv

; OTA upload (uncomment & set IP once you have a bridge node on your LAN)
; upload_protocol = espota
; upload_port = 192.168.1.XXX

; -----------------------------------------------------------------------------
; ESP8266 NodeMCU V2 (uncomment if using 8266 nodes)
; -----------------------------------------------------------------------------
; [env:nodemcuv2]
; platform = espressif8266
; board = nodemcuv2
; framework = ${common.framework}
; monitor_speed = ${common.monitor_speed}
; upload_speed = ${common.upload_speed}
; build_flags = ${common.build_flags}
; monitor_filters = default
; lib_deps =
;     ${common.lib_deps}
;     ESPAsyncTCP
